[project]
name = "memberassist-backend"
version = "0.1.0"
description = "MemberAssist — secure AI assistant for health-insurance members (Evernorth case study)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # ---- web framework ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    # ---- config & validation ----
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # ---- database ----
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # ---- auth & limits ----
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    # ---- http & caching ----
    "httpx>=0.27",
    "tenacity>=9.0",
    "diskcache>=5.6",
    # ---- cli ----
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Installed in Phase 2+. Kept separate so Phase 0/1 stay fast to set up.
rag = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "sentence-transformers>=3.3",
    "chromadb>=0.5.20",
    "rank-bm25>=0.2.2",
    # The knowledge base includes published HTML policy pages (healthcare.gov,
    # the CMS coverage database, a commercial insurer's policy bulletin), so the
    # parser needs a real HTML tree rather than a regular expression.
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]
security = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7,<3.9",
    "en-core-web-lg",
]
ai = [
    "torch>=2.5",
    "transformers>=4.46",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
]
llm = [
    "google-genai>=0.3",
    "openai>=1.57",
]
voice = [
    "faster-whisper>=1.1",
]
ocr = [
    "rapidocr-onnxruntime>=1.4",
    "pillow>=11.0",
]
docgen = [
    "reportlab>=4.2",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "ARG",      # unused arguments
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",    # line length handled by the formatter
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"scripts/*" = ["T201"]
# These two modules exist to normalise and match typographic characters, so the
# ambiguous-character lint is reporting exactly the content that must be there:
# the keys of the punctuation map and the en/em dashes in the heading patterns.
"app/rag/parse.py" = ["RUF001"]
"app/rag/chunk.py" = ["RUF001"]
# The parsing tests quote real document text, smart punctuation included -- that
# is what they exist to assert is normalised.
"tests/test_rag_parsing.py" = ["RUF001"]
"tests/test_kb_consistency.py" = ["RUF001"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
# The specification requires gateway/ and tools/; services/, external/ and
# auth/ are included because they hold the money arithmetic, the API clients
# and the password hashing, where a type slip would be expensive.
files = [
    "app/gateway",
    "app/tools",
    "app/services",
    "app/external",
    "app/auth",
    "app/db",
    # Added in Phase 2: the retrieval path decides which plan's documents a
    # member can read, so a type slip here is a confidentiality bug.
    "app/rag",
    "app/ai",
]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: hits real external APIs or real LLMs (excluded from the fast suite)",
    "slow: loads local models (excluded from the fast suite)",
]
